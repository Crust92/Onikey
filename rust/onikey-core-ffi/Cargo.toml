[package]
name = "onikey-core-ffi"
version = "1.0.3"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Vỏ C FFI của lõi Onikey, để adapter Fcitx5/IBus/XIM gọi vào"

[lib]
name = "onikey_core"
crate-type = ["staticlib", "cdylib"]

[dependencies]
onikey-core = { path = "../onikey-core" }
onikey-userconfig = { path = "../onikey-userconfig" }
