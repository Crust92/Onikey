<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Ubuntu">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e0f16"/><stop offset="0.55" stop-color="#14121d"/><stop offset="1" stop-color="#1c1220"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f39662"/><stop offset="1" stop-color="#e3163c"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#e3163c" stop-opacity="0.42"/><stop offset="1" stop-color="#e3163c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#f39662" stop-opacity="0.26"/><stop offset="1" stop-color="#f39662" stop-opacity="0"/>
  </radialGradient>

    <linearGradient id="onikeyCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f5e"/>
      <stop offset="1" stop-color="#d8123a"/>
    </linearGradient>
    <linearGradient id="onikeyHorn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f39662"/>
      <stop offset="1" stop-color="#e3163c"/>
    </linearGradient>
  </defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<ellipse cx="1020" cy="130" rx="430" ry="340" fill="url(#glow)"/>
<ellipse cx="140" cy="610" rx="380" ry="270" fill="url(#glow2)"/>
<g transform="translate(82,74) scale(2.1)">
  <!-- sừng -->
  <path d="M10.5 12.5 L6.5 1.8 L18.5 8.2 Z" fill="url(#onikeyHorn)"/>
  <path d="M37.5 12.5 L41.5 1.8 L29.5 8.2 Z" fill="url(#onikeyHorn)"/>
  <!-- thân phím -->
  <rect x="4.5" y="8" width="39" height="38" rx="9" fill="url(#onikeyCap)"/>
  <!-- mặt phím bắt sáng -->
  <rect x="8" y="11.5" width="32" height="27" rx="7" fill="#ffffff" fill-opacity="0.13"/>
  <!-- chữ O -->
  <ellipse cx="24" cy="26.5" rx="8.6" ry="9.8" fill="none" stroke="#ffffff" stroke-width="5.2"/>
</g>
<text x="196" y="144" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1">Onikey</text>
<text x="86" y="252" font-size="42" font-weight="500" fill="#e8eaf2">Vietnamese input for Linux</text>
<text x="86" y="298" font-size="24" fill="#98a0b4">Rust engine · IBus &amp; Fcitx5 · Wayland &amp; X11</text>
<g font-size="20" fill="#d7dbe8"><rect x="86" y="344" width="150" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="161.0" y="373" text-anchor="middle">9 layouts</text><rect x="248" y="344" width="152" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="324.0" y="373" text-anchor="middle">9 charsets</text><rect x="412" y="344" width="130" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="477.0" y="373" text-anchor="middle">Macros</text></g>
<line x1="86" y1="432" x2="586" y2="432" stroke="#ffffff" stroke-opacity="0.10"/>
<text x="86" y="480" font-size="23" fill="#858da2">One command to install — then just press Super+Space.</text>
<text x="86" y="534" font-size="24" font-weight="500" fill="#f0a273">github.com/Crust92/Onikey</text>
<g transform="translate(690,150)">
  <rect x="0" y="0" width="430" height="330" rx="22" fill="#12141d" fill-opacity="0.94" stroke="#2b3145"/>
  <g transform="translate(28,26)">
    <circle cx="8" cy="8" r="6" fill="#ff5f57"/><circle cx="30" cy="8" r="6" fill="#febc2e"/><circle cx="52" cy="8" r="6" fill="#28c840"/>
  </g>
  <text x="30" y="112" font-size="21" fill="#6f778c">you type</text>
  <text x="30" y="160" font-size="38" font-weight="500" fill="#aab2c6" font-family="Ubuntu Mono, monospace">tieengs Vieejt</text>
  <line x1="30" y1="174" x2="330" y2="174" stroke="#7b8398" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="30" y="238" font-size="21" fill="#6f778c">you get</text>
  <text x="30" y="290" font-size="46" font-weight="700" fill="#ffffff">tiếng Việt</text>
  <rect x="254" y="254" width="4" height="44" fill="url(#accent)"/>
